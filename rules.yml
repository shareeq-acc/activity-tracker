# ===========================================================================
#  Activity categorisation rules
# ===========================================================================
#  Rules are evaluated TOP TO BOTTOM and the FIRST match wins. That is why the
#  specific browser rules sit above the generic browser rule: a Chrome window
#  titled "... - YouTube" must be caught before Chrome falls through to
#  "browsing".
#
#  Match fields (all optional, all case-insensitive; a rule needs at least one):
#    exe        : process name, supports * globs        e.g. [Code.exe, idea*.exe]
#    title_any  : match if ANY of these appear in the window title
#    title_all  : match only if ALL of these appear
#    title_not  : veto - skip this rule if ANY of these appear
#
#  After editing, hit "Reload rules" in Settings (or POST /api/rules/reload).
#  History is re-categorised in place, so fixing a rule also fixes the past.
# ===========================================================================

version: 1

# --- Buckets roll categories up into the learning-vs-distraction ratio -----
#     bucket: growth | neutral | distraction | idle
categories:
  building:      { label: "Building",       bucket: growth,      color: "#34d399" }
  learning:      { label: "Learning",       bucket: growth,      color: "#38bdf8" }
  communication: { label: "Communication",  bucket: neutral,     color: "#a78bfa" }
  browsing:      { label: "Browsing",       bucket: neutral,     color: "#94a3b8" }
  utility:       { label: "Utility",        bucket: neutral,     color: "#64748b" }
  social:        { label: "Social media",   bucket: distraction, color: "#fb7185" }
  watching:      { label: "Watching",       bucket: distraction, color: "#f59e0b" }
  gaming:        { label: "Gaming",         bucket: distraction, color: "#e879f9" }
  idle:          { label: "Idle / away",    bucket: idle,        color: "#334155" }
  uncategorized: { label: "Uncategorized",  bucket: neutral,     color: "#475569" }

fallback: uncategorized

rules:
  # -- idle is emitted by the collector itself ------------------------------
  - id: idle
    category: idle
    exe: ["__idle__", "__locked__"]

  # -- social media (must precede the generic browser rule) -----------------
  - id: social-web
    category: social
    exe: [chrome.exe, msedge.exe, firefox.exe, brave.exe, opera.exe, vivaldi.exe, zen.exe, arc.exe]
    title_any:
      - " / X"
      - twitter
      - facebook
      - instagram
      - reddit
      - tiktok
      - linkedin
      - threads
      - snapchat
      - 9gag
      - pinterest
  - id: social-app
    category: social
    exe: [Instagram.exe, TikTok.exe]

  # -- watching / entertainment --------------------------------------------
  # A YouTube tab that is clearly educational is caught by the NEXT rule, so
  # this one vetoes those keywords via title_not.
  - id: watching-web
    category: watching
    exe: [chrome.exe, msedge.exe, firefox.exe, brave.exe, opera.exe, vivaldi.exe, zen.exe, arc.exe]
    title_any:
      - youtube
      - netflix
      - twitch
      - primevideo
      - "prime video"
      - "disney+"
      - hulu
      - crunchyroll
      - hotstar
      - cricbuzz
      - espn
      - "- IMDb"
    title_not:
      - tutorial
      - "full course"
      - lecture
      - "crash course"
      - "conference talk"
  - id: watching-as-learning
    category: learning
    exe: [chrome.exe, msedge.exe, firefox.exe, brave.exe, opera.exe, vivaldi.exe, zen.exe, arc.exe]
    title_all: [youtube]
    title_any:
      - tutorial
      - "full course"
      - lecture
      - "crash course"
      - "conference talk"
  - id: watching-app
    category: watching
    exe: [vlc.exe, mpc-hc64.exe, mpv.exe, PotPlayerMini64.exe, Netflix.exe, Video.UI.exe]

